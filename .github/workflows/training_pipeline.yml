name: Training Pipeline (Daily)

on:
  schedule:
    - cron: "30 2 * * *"   # daily at 02:30 UTC — runs AFTER hourly feature run
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  training-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # needed to git-push trained models back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements/requirements.txt

      # ── Verify training data ───────────────────────────────────────────────
      - name: Verify training data exists
        run: |
          if [ -f data/lahore_aqi_historical_2024_onwards.csv ]; then
            ROWS=$(tail -n +2 data/lahore_aqi_historical_2024_onwards.csv | wc -l)
            echo "✅ Training data found: $ROWS rows"
          else
            echo "❌ No feature CSV found. Run the feature pipeline first."
            exit 1
          fi

      # ── Train models for all 3 horizons and update predictions ────────────
      - name: Run training & inference pipeline
        run: |
          python pipelines/training_pipeline.py
          python pipelines/inference_pipeline.py

      # ── Commit trained models & updated JSON back to repo ─────────────────
      - name: Commit trained models and dashboard data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ data/aqi_dashboard_data.json data/lahore_aqi_3day_forecast.csv || true
          git diff --cached --quiet || \
            (git commit -m "chore(models): daily model retrain and forecast update" && git pull --rebase && git push) || true

      # ── Also upload as a workflow artifact (available for 30 days) ────────
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-models-${{ github.run_id }}
          path: models/
          retention-days: 30
          if-no-files-found: warn
